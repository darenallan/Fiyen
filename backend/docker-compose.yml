services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fiyen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fiyen
      POSTGRES_PASSWORD: fiyen_dev_password
      POSTGRES_DB: fiyen
    ports:
      - "55020:5432"
    volumes:
      - fiyen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiyen -d fiyen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fiyen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fiyen_postgres_data:
